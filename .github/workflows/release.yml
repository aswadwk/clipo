name: Release

# Tag & release with Semantic Versioning.
#
#  • Push to `main`  → auto-computes the next SemVer tag from Conventional
#    Commits, creates the tag, then builds and publishes the release.
#  • Push a tag `vX.Y.Z` manually → skips bumping and just builds + releases it.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Decide the version. On a branch push we compute the next tag from commit
  #    history; on a tag push we simply reuse the pushed tag.
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      released: ${{ steps.resolve.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: bump
        if: startsWith(github.ref, 'refs/heads/')
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
          fetch_all_tags: true

      - name: Resolve tag
        id: resolve
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "released=true"  >> "$GITHUB_OUTPUT"
          else
            TAG="${{ steps.bump.outputs.new_tag }}"
            echo "released=${{ steps.bump.outputs.new_tag != '' }}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG"                >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"        >> "$GITHUB_OUTPUT"
          echo "Resolved: $TAG"

  # 2. Build the .app, zip it, and publish the GitHub Release.
  build:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set version
        env:
          VERSION: ${{ needs.version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$VERSION\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml

      - name: Build
        run: |
          xcodegen generate
          xcodebuild -project Clipo.xcodeproj -scheme Clipo \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build build

      - name: Package
        run: |
          APP="build/Build/Products/Release/Clipo.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Clipo-${{ needs.version.outputs.tag }}.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Clipo ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: Clipo-${{ needs.version.outputs.tag }}.zip
